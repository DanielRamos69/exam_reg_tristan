<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>New Exam Session</title></head>
<body>
  <h1>Create New Exam Session</h1>
  <p><a href="{{ url_for('faculty_portal') }}">⟵ Back</a></p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul>
        {% for c,m in messages %}
          <li><strong>{{ c|capitalize }}:</strong> {{ m }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <form method="post">
    <label>Exam
      <select name="exam_id" required>
        <option value="">-- choose exam --</option>
        {% for e in exams %}
          <option value="{{ e.id }}">{{ e.exam_code }}</option>
        {% endfor %}
      </select>
    </label><br>

    <label>Location
      <select name="location_id" required>
        <option value="">-- choose location --</option>
        {% for l in locations %}
          <option value="{{ l.id }}">{{ l.campus_name }} / {{ l.building_name }} / {{ l.room_number }}</option>
        {% endfor %}
      </select>
    </label><br>

    <label>Date/Time (YYYY-MM-DD HH:MM)
      <input name="session_datetime" placeholder="2025-11-25 14:00" required>
    </label><br>

    <label>Capacity
      <input type="number" name="capacity" value="20" min="1" required>
    </label><br>

    <button type="submit">Create</button>
  </form>
</body>
</html>
