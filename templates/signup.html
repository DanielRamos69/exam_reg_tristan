<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.5rem; }
    form label { display: block; margin: 0.5rem 0; }
    input[type="text"], input[type="password"] { padding: 0.5rem; width: 100%; max-width: 420px; }
    fieldset { border: 0; padding: 0; margin: 0.5rem 0 0; }
    .messages { padding: 0; list-style: none; }
    .messages li { margin: 0.25rem 0; }
    .messages strong { text-transform: capitalize; }
    button { margin-top: 0.75rem; padding: 0.6rem 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Create account</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="messages">
        {% for c, m in messages %}
          <li><strong>{{ c }}:</strong> {{ m }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <form method="post" action="{{ url_for('signup') }}">
    <label>
      Full name
      <input name="full_name" required />
    </label>

    <label>
      Email
      <input
        type="text"
        name="email"
        required
        pattern="^\d{10}@student\.csn\.edu$|^[A-Za-z]+\.[A-Za-z]+@csn\.edu$"
        title="Student: 10digits@student.csn.edu  |  Faculty: firstname.lastname@csn.edu" />
    </label>

    <label>
      Password
      <input
        type="password"
        name="password"
        required
        pattern="^\d{10}$|^.{7,}$"
        title="Student: exactly 10 digits (your NSHE). Faculty: at least 7 characters." />
    </label>

    <label>
      Confirm
      <input
        type="password"
        name="confirm"
        required
        pattern="^\d{10}$|^.{7,}$"
        title="Re-enter the same password." />
    </label>

    <fieldset>
      <legend>Role</legend>
      <label><input type="radio" name="role" value="student" checked /> Student</label>
      <label><input type="radio" name="role" value="faculty" /> Faculty</label>
    </fieldset>

    <button type="submit">Create Account</button>
  </form>

  <p><a href="{{ url_for('login') }}">Have an account? Log in</a></p>
</body>
</html>
